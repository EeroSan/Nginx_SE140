version: "3"
services:
  nginx:
    build:
      context: ./Nginx
    ports:
      - 8198:8198
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NGINX_PORT=8198
    networks:
      - backend
    depends_on:
      - service1
      - service2

  service1:
    build:
      context: ./Service1
      dockerfile: Dockerfile.prod
    environment:
      - SLEEPSECONDS=2
      - PORT=8199
    deploy:
      replicas: 3
    networks:
      - backend

  service2:
    build:
      context: ./Service2
      dockerfile: Dockerfile.prod
    environment:
      - PORT=5000
    networks:
      - backend
    depends_on:
      - service1  

  test_service1:
    build:
      context: ./Service1
      dockerfile: Dockerfile.test
    environment:
      - SLEEPSECONDS=2
      - PORT=8199
    deploy:
      replicas: 1
    networks:
      - backend

  test_service2:
    build:
      context: ./Service2
      dockerfile: Dockerfile.test
    environment:
      - PORT=5000
    networks:
      - backend
    depends_on:
      - service1  
  

networks:
  backend: