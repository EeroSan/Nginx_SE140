services:
  test_service1:
    build:
      context: .
      dockerfile: ./Service1/Dockerfile.test
    volumes:
      - ./tests/service1_tests:/app/tests
    environment:
      - SLEEPSECONDS=2
      - PORT=6000
    networks:
      - backend

  test_service2:
    build:
      context: .
      dockerfile: ./Service2/Dockerfile.test
    volumes:
      - ${PROJECT_DIR:-.}/tests/service2_tests:/app/tests/service2_tests
    # volumes:
    #   - ./tests/service2_tests:/app/tests/service2_tests
    tmpfs:
      - /app/tests/__pycache__
    environment:
      - PORT=7000
    networks:
      - backend
  
  test_gateway:
    build:
      context: .
      dockerfile: ./Gateway/Dockerfile.test
    volumes:
      - ./tests/gateway_tests:/app/tests
    environment:
      - SLEEPSECONDS=2
      - PORT=8000
    networks:
      - backend
  
  test_stateservice:
    build:
      context: .
      dockerfile: ./StateService/Dockerfile.test
    volumes:
      - ./tests/stateservice_tests:/app/tests
    environment:
      - RUN_TESTS=YES
      - PORT=8195
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_IP=${MONGO_IP}
      - MONGO_DB=${MONGO_DB}
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_COLLECTION=${MONGO_COLLECTION}
    networks:
      - backend
  

networks:
  backend: